name: ACPA Runtime Conformance

on:
  push:
    branches:
      - "execution/**"
  workflow_dispatch:

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Health
        run: python runtime/acpa_runtime.py health
      - name: Smoke
        run: python runtime/acpa_runtime.py smoke
